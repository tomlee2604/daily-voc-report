name: 업데이트 알림

# index.html의 데이터(VOC·도급비·근무 로스터·순회차량·교육 영상)가 바뀐 배포에만, 배포가 끝난 뒤 알림을 보냄.
# 디자인·기능만 바뀐 배포에는 보내지 않음. Actions 탭에서 직접 문구를 써서 보낼 수도 있음.
on:
  push:
    branches: [main]
    paths: [index.html]
  workflow_dispatch:
    inputs:
      message:
        description: '알림 문구 (비우면 직전 버전과 비교해 자동 작성)'
        required: false
      to:
        description: '받는 사람만 (예: 마스터, 전주 CDC, 김기태) — 비우면 구독한 모든 기기'
        required: false

permissions:
  contents: read
  checks: read

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 이전 버전 꺼내기
        run: git show HEAD~1:index.html > /tmp/prev.html 2>/dev/null || rm -f /tmp/prev.html

      - name: 사이트 배포 끝날 때까지 기다리기
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            r=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs --jq '.check_runs[] | select(.name=="deploy") | .status + " " + (.conclusion // "")' 2>/dev/null || true)
            echo "$i: deploy $r"
            case "$r" in "completed success") exit 0;; "completed "*) echo "배포 실패 — 알림 안 보냄"; exit 1;; esac
            sleep 10
          done
          echo "배포 확인 시간 초과 — 그래도 알림은 보냄"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 알림 보내기
        env:
          VAPID_PUBLIC_KEY: BBtnhR6k0lO5Fa4HPqcSTVfW7tE2ExPaszmcf2o6gUWR2fbCXLcjrWTjv8K8sqxzcdi_W40LboXEltihq8LCsCw
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          MESSAGE: ${{ github.event.inputs.message }}
          # 임시: 배포 후 자동 알림은 '마스터'로 구독한 기기에만 보냄 (수동 발송은 입력한 받는 사람 그대로).
          # 다시 모든 구독자에게 보내려면 아래 줄을 TO: ${{ github.event.inputs.to }} 로 되돌리세요.
          TO: ${{ github.event_name == 'push' && '마스터' || github.event.inputs.to }}
          DEBUG_SHEET: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          npm i --no-save web-push@3.6.7 >/dev/null
          node .github/scripts/notify.mjs /tmp/prev.html index.html
